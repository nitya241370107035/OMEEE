# Temporal Data Collection Configuration for Multi-Temporal Satellite Analysis

version: "1.0.0"
environment: "production"

# Master Temporal Window
temporal_scope:
  target_years:
    - 2017
    - 2018
    - 2019
    - 2020
    - 2021
    - 2022
    - 2023
    - 2024
    - 2025
    - 2026
  # High-altitude snow-free summer/autumn seasonal acquisition window (July 1 - October 31)
  seasonal_window:
    start_month_day: "07-01"
    end_month_day: "10-31"

# STAC Search Defaults
stac_search_policy:
  endpoint: "https://earth-search.aws.element84.com/v1"
  collection: "sentinel-2-l2a"
  sensor: "Sentinel-2 MSI"
  maximum_catalog_cloud_cover: 20.0
  auto_download: false  # Safety default: Explicit command required for downloading

# Preprocessing & Tiling Configuration
processing_policy:
  crs: "EPSG:4326"
  target_pixel_res_deg: 0.00008983  # ~10m at equator
  ground_crop_size: 512
  overlap_ratio: 0.10
  cloud_threshold: 0.40
  shadow_threshold: 450.0
  normalization:
    p_low: 1.0
    p_high: 98.5
    gamma: 0.85

# Active Domain Profiles
domains:
  pipeline_validation:
    region_id: "pipeline_validation_current_aoi"
    geometry_file: "tests/sample_aoi.geojson"
    target_years: [2017, 2023]
    seasonal_window: "01-01/12-31"
    output_path: "datasets/pipeline_validation/current_aoi"
    auto_download: false

  eastern_ladakh:
    region_id: "eastern_ladakh_pangong"
    geometry_file: "config/eastern_ladakh_aois/geometries/pangong_tso.geojson"
    target_years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    seasonal_window: "07-01/10-31"
    output_path: "datasets/eastern_ladakh/sentinel2"
    auto_download: false
