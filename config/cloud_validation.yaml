# Cloud Masking Validation Configuration
# Defines search parameters, test categories, and target AOIs for evaluating s2cloudless

scene_selection:
  mode: cloud_masking_test
  default_category: medium_cloud
  default_aoi_id: current_aoi
  stac_endpoint: "https://earth-search.aws.element84.com/v1"
  collection: "sentinel-2-l2a"
  datetime_range: "2023-01-01/2023-12-31"

categories:
  clear_control:
    description: "Clear-sky control benchmark (0% - 10% cloud)"
    minimum_cloud_cover: 0.0
    maximum_cloud_cover: 10.0
    preferred_cloud_cover: 5.0

  light_cloud:
    description: "Light cloud cover benchmark (10% - 30% cloud)"
    minimum_cloud_cover: 10.0
    maximum_cloud_cover: 30.0
    preferred_cloud_cover: 20.0

  medium_cloud:
    description: "Medium cloud cover benchmark (30% - 60% cloud)"
    minimum_cloud_cover: 30.0
    maximum_cloud_cover: 60.0
    preferred_cloud_cover: 45.0

  heavy_cloud:
    description: "Heavy cloud cover benchmark (60% - 90% cloud)"
    minimum_cloud_cover: 60.0
    maximum_cloud_cover: 90.0
    preferred_cloud_cover: 75.0

aoi_definitions:
  current_aoi:
    display_name: "Delhi Cantonment Validation AOI"
    geojson_path: "tests/sample_aoi.geojson"
  pangong_tso:
    display_name: "Pangong Tso North Bank AOI"
    geojson_path: "config/eastern_ladakh_aois/geometries/pangong_tso.geojson"
